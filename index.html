<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>壽星優惠 🎁</title>

  <link rel="icon" type="image/png" href="image.png">
  <link rel="apple-touch-icon" href="image.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="壽星優惠">

  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;600&display=swap');
    body { font-family: 'Kiwi Maru', serif; background-color: #fff8eb; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #fbcfe8; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 客製化圖示 SVG 元件 (取代原本的 lucide-react 依賴) ---
    const IconWrapper = ({ children, size = 24, className = "", strokeWidth = 2 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const MapPin = (props) => <IconWrapper {...props}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></IconWrapper>;
    const Tag = (props) => <IconWrapper {...props}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></IconWrapper>;
    const Calendar = (props) => <IconWrapper {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></IconWrapper>;
    const Clock = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></IconWrapper>;
    const Store = (props) => <IconWrapper {...props}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></IconWrapper>;
    const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconWrapper>;
    const Circle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"></circle></IconWrapper>;
    const Info = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></IconWrapper>;
    const Search = (props) => <IconWrapper {...props}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></IconWrapper>;
    const Plus = (props) => <IconWrapper {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconWrapper>;
    const Edit2 = (props) => <IconWrapper {...props}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></IconWrapper>;
    const Trash2 = (props) => <IconWrapper {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconWrapper>;
    const X = (props) => <IconWrapper {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconWrapper>;
    const Save = (props) => <IconWrapper {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></IconWrapper>;
    const AlertCircle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></IconWrapper>;
    const Check = (props) => <IconWrapper {...props}><polyline points="20 6 9 17 4 12"></polyline></IconWrapper>;
    const Eraser = (props) => <IconWrapper {...props}><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20"></path><path d="M6 11l7 7"></path></IconWrapper>;

    // --- APP 主程式開始 ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLpdOB5Gu93tUOVP4yGUxmRnt8RqX9LfGvu2qY1YB86nnS1KBWYZkbmYg-_wjwX8IA/exec";

    const checkExcelRedeemed = (val) => {
      if (typeof val === 'boolean') return val;
      if (!val) return false;
      const str = val.toString().trim().toLowerCase();
      return ['v', '是', 'true', '完成', '1', 'ok', '已兌換', 'y', 'yes'].includes(str);
    };

    const formatDate = (dateString) => {
      if (!dateString) return '';
      if (typeof dateString === 'string' && dateString.includes('T') && dateString.includes('Z')) {
        try {
          const d = new Date(dateString);
          if (!isNaN(d.getTime())) {
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
          }
        } catch (e) {
          return dateString;
        }
      }
      return String(dateString);
    };

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const [filters, setFilters] = useState({ monthDay: '', category: '', city1: '', city2: '' });
      const [showRedeemedOnly, setShowRedeemedOnly] = useState(false);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [formData, setFormData] = useState({
        store: '', offer: '', conditions: '', monthDay: '', category: '', channel: '', city1: '', city2: '', deadline: '', redeemed: false
      });

      const [alertModal, setAlertModal] = useState({ isOpen: false, text: '' });
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, text: '', onConfirm: null });

      const fetchData = async () => {
        setLoading(true);
        try {
          const response = await fetch(SCRIPT_URL);
          const text = await response.text();
          let result;
          try {
            result = JSON.parse(text);
          } catch (e) {
            throw new Error("伺服器回傳格式錯誤，請確認 API 網址是否正確且已發布為「所有人」。");
          }

          if (result.status === 'error') throw new Error(result.message);

          const processedData = result.map((item, index) => ({
            ...item,
            id: item.id || `temp_${Date.now()}_${Math.random().toString(36).substr(2, 9)}_${index}`,
            redeemed: checkExcelRedeemed(item.redeemed)
          }));
          
          setData(processedData);
          setError(null);
        } catch (err) {
          console.error("Fetch error:", err);
          setError(err.message || "無法載入資料。");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      const callAPI = async (action, payload, silent = false) => {
        if (!silent) setIsSubmitting(true);
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          });
          
          const text = await response.text();
          let result;
          try {
            result = JSON.parse(text);
          } catch (parseError) {
            throw new Error("Google 伺服器無回應，請確認部署版本。");
          }

          if (result.status === 'success') {
            if (!silent) fetchData(); 
            return true;
          } else {
            throw new Error(result.message || '操作失敗');
          }
        } catch (err) {
          setAlertModal({ isOpen: true, text: `❌ 同步失敗：\n${err.message}` });
          return false;
        } finally {
          if (!silent) setIsSubmitting(false);
        }
      };

      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
      };

      const openModal = (item = null) => {
        if (item) {
          setEditingItem(item);
          setFormData({ ...item, deadline: formatDate(item.deadline) });
        } else {
          setEditingItem(null);
          setFormData({ store: '', offer: '', conditions: '', monthDay: '', category: '', channel: '', city1: '', city2: '', deadline: '', redeemed: false });
        }
        setIsModalOpen(true);
      };

      const handleSave = async () => {
        if (!formData.store || !formData.offer) {
          setAlertModal({ isOpen: true, text: "請至少填寫店家與優惠項目喔！" });
          return;
        }
        
        const action = editingItem ? 'UPDATE' : 'ADD';
        const payload = { ...formData };
        if (editingItem) payload.id = editingItem.id;

        const success = await callAPI(action, payload);
        if (success) setIsModalOpen(false);
      };

      const handleDeleteClick = (id) => {
        setConfirmModal({
          isOpen: true,
          text: "確定要刪除這筆優惠嗎？這將會同步從 Excel 中永久刪除喔！",
          onConfirm: async () => {
            setConfirmModal({ isOpen: false, text: '', onConfirm: null });
            await callAPI('DELETE', { id });
          }
        });
      };

      const toggleRedeem = async (item) => {
        if (!item.id) {
           setAlertModal({ isOpen: true, text: "這筆資料尚無 ID，請先重新整理網頁！" });
           return;
        }
        const newStatus = !item.redeemed;
        setData(prev => prev.map(d => d.id === item.id ? { ...d, redeemed: newStatus } : d));
        
        const success = await callAPI('TOGGLE_REDEEM', { id: item.id, redeemed: newStatus }, true);
        if (!success) {
          setData(prev => prev.map(d => d.id === item.id ? { ...d, redeemed: item.redeemed } : d));
        }
      };

      const handleClearAllClick = () => {
        setConfirmModal({
          isOpen: true,
          text: "確定要一鍵清除所有的「兌換狀態」與「期限」嗎？這將會同步修改 Excel 且無法復原喔！",
          onConfirm: async () => {
            setConfirmModal({ isOpen: false, text: '', onConfirm: null });
            setData(prev => prev.map(d => ({ ...d, redeemed: false, deadline: '' })));
            await callAPI('CLEAR_ALL', {});
          }
        });
      };

      const options = useMemo(() => {
        const monthDays = new Set();
        const categories = new Set();
        const cities1 = new Set();
        const cities2 = new Set();

        data.forEach(item => {
          if (item.monthDay) monthDays.add(String(item.monthDay));
          if (item.category) categories.add(String(item.category));
          if (item.city1) {
            String(item.city1).split(/[、,，]/).map(c => c.trim()).filter(c => c).forEach(city => cities1.add(city));
          }
          
          let isCity1Matched = true;
          if (filters.city1) {
            if (!item.city1) {
              isCity1Matched = false;
            } else {
              const itemCities = String(item.city1).split(/[、,，]/).map(c => c.trim());
              if (!itemCities.includes(filters.city1)) isCity1Matched = false;
            }
          }

          if (isCity1Matched && item.city2) {
            String(item.city2).split(/[、,，]/).map(c => c.trim()).filter(c => c).forEach(city => {
              // 特別針對「新竹」的防呆過濾機制
              if (filters.city1) {
                const isCity1Hsinchu = filters.city1.includes('新竹');
                const isCity2Hsinchu = city.includes('新竹');
                
                // 如果縣市1選了新竹，縣市2就只能出現包含新竹的字眼
                if (isCity1Hsinchu && !isCity2Hsinchu) return;
                // 如果縣市1選了非新竹，縣市2就直接排除包含新竹的字眼
                if (!isCity1Hsinchu && isCity2Hsinchu) return;
              }
              cities2.add(city);
            });
          }
        });

        return {
          monthDays: Array.from(monthDays).sort(),
          categories: Array.from(categories).sort(),
          cities1: Array.from(cities1).sort(),
          cities2: Array.from(cities2).sort()
        };
      }, [data, filters.city1]);

      const filteredData = useMemo(() => {
        return data.filter(item => {
          // 修改處：預設隱藏已兌換，點選按鈕後才顯示已兌換
          if (showRedeemedOnly && !item.redeemed) return false;
          if (!showRedeemedOnly && item.redeemed) return false;

          if (filters.monthDay && String(item.monthDay) !== filters.monthDay) return false;
          if (filters.category && String(item.category) !== filters.category) return false;
          if (filters.city1) {
            if (!item.city1) return false;
            const itemCities = String(item.city1).split(/[、,，]/).map(c => c.trim());
            if (!itemCities.includes(filters.city1)) return false;
          }
          if (filters.city2) {
            if (!item.city2) return false;
            const itemCities2 = String(item.city2).split(/[、,，]/).map(c => c.trim());
            if (!itemCities2.includes(filters.city2)) return false;
          }
          return true;
        });
      }, [data, filters, showRedeemedOnly]);

      const totalRedeemedCount = data.filter(item => item.redeemed).length;

      if (loading && data.length === 0) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center">
            <div className="text-6xl animate-bounce mb-4">🎂</div>
            <p className="text-pink-600 font-bold text-2xl animate-pulse">正在連線至 Excel...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12 relative">
          
          {isSubmitting && (
             <div className="fixed inset-0 bg-white/70 backdrop-blur-sm z-[100] flex items-center justify-center">
                <div className="bg-white px-10 py-8 rounded-3xl shadow-2xl flex flex-col items-center border-4 border-pink-200">
                  <div className="text-6xl animate-spin mb-4">⏳</div>
                  <p className="text-pink-600 font-extrabold text-2xl tracking-widest">努力同步中...</p>
                  <p className="text-gray-500 mt-2 font-medium">資料即將寫入 Excel，請稍候</p>
                </div>
             </div>
          )}

          <div className="bg-[#fff1f2] border-b-[3px] border-pink-200 shadow-sm md:sticky md:top-0 z-20 pb-4">
            <div className="max-w-5xl mx-auto px-4 pt-6">
              <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                <h1 className="text-3xl md:text-4xl font-extrabold text-[#e11d48] flex items-center gap-2 drop-shadow-sm">
                  <span>壽星優惠 🎁</span>
                </h1>
                <div className="flex items-center gap-2 md:gap-3">
                  <button 
                    onClick={() => setShowRedeemedOnly(!showRedeemedOnly)} 
                    className={`px-3 py-1.5 md:px-4 md:py-2 rounded-full border-2 shadow-sm flex items-center gap-1 md:gap-2 transition-all duration-300 hover:scale-105 ${
                      showRedeemedOnly ? 'bg-pink-500 border-pink-600 text-white' : 'bg-white border-pink-300 hover:bg-pink-50'
                    }`}
                    title={showRedeemedOnly ? "點擊返回未完成項目" : "點擊查看已完成項目"}
                  >
                    <span className="text-base md:text-xl">{showRedeemedOnly ? '🎁' : '🍰'}</span>
                    <span className="text-xs md:text-base font-bold">
                      {showRedeemedOnly ? '看未兌換' : '已完成'}: <span className={showRedeemedOnly ? 'text-white font-extrabold' : 'text-pink-600 font-extrabold'}>{totalRedeemedCount}</span> 筆
                    </span>
                  </button>

                  <button 
                    onClick={handleClearAllClick}
                    className="bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-500 p-2 md:p-3 rounded-full shadow-md border border-gray-300 transition-transform hover:scale-110"
                    title="一鍵大掃除（清除所有狀態與期限）"
                  >
                    <Eraser size={20} />
                  </button>

                  <button 
                    onClick={() => openModal()} 
                    className="bg-pink-500 hover:bg-pink-600 text-white p-2 md:p-3 rounded-full shadow-md transition-transform hover:scale-110" 
                    title="新增優惠"
                  >
                    <Plus size={20} />
                  </button>
                </div>
              </div>

              {error && (
                <div className="mt-4 p-4 bg-red-50 text-red-700 rounded-2xl border border-red-200 flex items-start gap-3 shadow-inner">
                  <AlertCircle className="shrink-0 mt-0.5 text-red-500" />
                  <div><strong className="block mb-1">連線發生錯誤：</strong>{String(error)}</div>
                </div>
              )}

              <div className="mt-6 bg-white p-5 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-2 border-pink-100 relative overflow-hidden">
                <div className="absolute -right-6 -top-6 text-6xl opacity-10">🎊</div>
                <div className="flex items-center gap-2 mb-4 text-pink-600 font-bold text-lg">
                  <Search size={22} />
                  <span>快速找尋您的優惠 🥳</span>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                  <div className="relative">
                    <select value={filters.monthDay} onChange={(e) => setFilters({ ...filters, monthDay: e.target.value })}
                      className="w-full appearance-none bg-pink-50 border-2 border-pink-200 text-gray-700 py-2 md:py-3 pl-8 md:pl-10 pr-6 md:pr-8 rounded-xl md:rounded-2xl focus:outline-none focus:border-pink-400 font-medium cursor-pointer text-xs md:text-base"
                    >
                      <option value="">🍰 時效</option>
                      {options.monthDays.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                    <Calendar className="absolute left-2.5 top-2.5 md:top-3.5 text-pink-400" size={16} />
                  </div>

                  <div className="relative">
                    <select value={filters.category} onChange={(e) => setFilters({ ...filters, category: e.target.value })}
                      className="w-full appearance-none bg-orange-50 border-2 border-orange-200 text-gray-700 py-2 md:py-3 pl-8 md:pl-10 pr-6 md:pr-8 rounded-xl md:rounded-2xl focus:outline-none focus:border-orange-400 font-medium cursor-pointer text-xs md:text-base"
                    >
                      <option value="">🎈 分類</option>
                      {options.categories.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                    <Tag className="absolute left-2.5 top-2.5 md:top-3.5 text-orange-400" size={16} />
                  </div>

                  <div className="relative">
                    <select value={filters.city1} onChange={(e) => setFilters({ ...filters, city1: e.target.value, city2: '' })}
                      className="w-full appearance-none bg-yellow-50 border-2 border-yellow-200 text-gray-700 py-2 md:py-3 pl-8 md:pl-10 pr-6 md:pr-8 rounded-xl md:rounded-2xl focus:outline-none focus:border-yellow-400 font-medium cursor-pointer text-xs md:text-base"
                    >
                      <option value="">🗺️ 地區</option>
                      {options.cities1.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                    <MapPin className="absolute left-2.5 top-2.5 md:top-3.5 text-yellow-500" size={16} />
                  </div>

                  <div className="relative">
                    <select value={filters.city2} onChange={(e) => setFilters({ ...filters, city2: e.target.value })}
                      className="w-full appearance-none bg-green-50 border-2 border-green-200 text-gray-700 py-2 md:py-3 pl-8 md:pl-10 pr-6 md:pr-8 rounded-xl md:rounded-2xl focus:outline-none focus:border-green-400 font-medium cursor-pointer text-xs md:text-base"
                    >
                      <option value=""></option>
                      {options.cities2.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                    <MapPin className="absolute left-2.5 top-2.5 md:top-3.5 text-green-500" size={16} />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="max-w-5xl mx-auto px-4 mt-8">
            {filteredData.length === 0 && !loading ? (
              <div className="text-center py-20 bg-white/60 rounded-3xl border-2 border-dashed border-pink-200">
                <div className="text-6xl mb-4">🥲</div>
                <h3 className="text-2xl font-bold text-gray-600">目前沒有符合的優惠</h3>
                <p className="text-gray-500 mt-2">{showRedeemedOnly ? "您還沒有完成任何優惠喔！" : "點擊右上角的「＋」來新增一筆吧！"}</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {filteredData.map((item) => (
                  <div key={item.id} className={`relative group bg-white p-6 rounded-3xl border-2 transition-all duration-300 shadow-sm hover:shadow-xl ${item.redeemed ? 'border-green-300 opacity-80 scale-[0.98]' : 'border-pink-100 hover:-translate-y-2'}`}>
                    <div className="absolute top-4 right-4 flex gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity z-10">
                       <button onClick={() => openModal(item)} className="p-2 bg-yellow-100 text-yellow-600 rounded-full hover:bg-yellow-200 shadow-sm" title="編輯"><Edit2 size={16} /></button>
                       <button onClick={() => handleDeleteClick(item.id)} className="p-2 bg-red-100 text-red-500 rounded-full hover:bg-red-200 shadow-sm" title="刪除"><Trash2 size={16} /></button>
                    </div>

                    <div className="flex flex-wrap gap-2 mb-4 pr-16">
                      {item.monthDay && <span className="text-xs font-bold px-3 py-1.5 bg-red-50 text-red-500 border border-red-100 rounded-xl flex items-center gap-1"><Calendar size={14}/> {item.monthDay}</span>}
                      {item.category && <span className="text-xs font-bold px-3 py-1.5 bg-blue-50 text-blue-500 border border-blue-100 rounded-xl flex items-center gap-1"><Tag size={14}/> {item.category}</span>}
                      {item.city1 && <span className="text-xs font-bold px-3 py-1.5 bg-yellow-50 text-yellow-700 border border-yellow-100 rounded-xl flex items-center gap-1"><MapPin size={14}/> {item.city1}</span>}
                      {item.city2 && <span className="text-xs font-bold px-3 py-1.5 bg-green-50 text-green-700 border border-green-100 rounded-xl flex items-center gap-1"><MapPin size={14}/> {item.city2}</span>}
                    </div>

                    <div className="flex justify-between items-start gap-3">
                      <div className="flex-1">
                        <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2 mb-2"><Store className="text-pink-400" size={24} />{item.store}</h2>
                        <p className="text-xl text-pink-600 font-bold mb-4 flex items-start gap-2 bg-pink-50 p-2 rounded-xl inline-block">🎁 {item.offer}</p>
                        <div className="space-y-2 text-[15px] text-gray-600">
                          <p className="flex items-start gap-2"><Info className="shrink-0 text-gray-400 mt-1" size={18} /><span><strong className="text-gray-700">條件：</strong>{item.conditions}</span></p>
                          <p className="flex items-center gap-2"><Store className="shrink-0 text-gray-400" size={18} /><span><strong className="text-gray-700">通路：</strong>{item.channel}</span></p>
                          <p className="flex items-center gap-2 text-orange-600 font-bold bg-orange-50 px-2 py-1 rounded-lg w-fit"><Clock className="shrink-0 text-orange-400" size={18} /><span>期限：{formatDate(item.deadline)}</span></p>
                        </div>
                      </div>
                      
                      <button onClick={() => toggleRedeem(item)} className={`shrink-0 flex flex-col items-center justify-center w-24 h-24 rounded-[2rem] transition-all duration-300 ${item.redeemed ? 'bg-green-100 text-green-600 shadow-inner' : 'bg-white text-gray-300 hover:bg-pink-50 hover:text-pink-400 border-[3px] border-gray-100 hover:border-pink-200 shadow-md hover:shadow-lg'}`}>
                        {item.redeemed ? (
                          <><CheckCircle size={44} className="mb-1" strokeWidth={2.5} /><span className="text-sm font-bold">已兌換</span></>
                        ) : (
                          <><Circle size={44} className="mb-1" strokeWidth={2} /><span className="text-sm font-bold">點我兌換</span></>
                        )}
                      </button>
                    </div>
                    {item.redeemed && <div className="absolute -top-4 -right-4 text-4xl animate-bounce pointer-events-none">🎊</div>}
                  </div>
                ))}
              </div>
            )}
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-pink-100 p-4 flex justify-between items-center border-b border-pink-200">
                  <h2 className="text-2xl font-bold text-pink-700 flex items-center gap-2">{editingItem ? '✏️ 編輯優惠' : '✨ 新增超棒優惠'}</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-pink-500 hover:text-pink-700 hover:bg-pink-200 p-1 rounded-full transition-colors"><X size={24} /></button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 space-y-4 custom-scrollbar">
                  <div className="grid grid-cols-2 gap-4">
                    <div className="col-span-2 sm:col-span-1"><label className="block text-sm font-bold text-gray-700 mb-1">🏪 店家名稱*</label><input type="text" name="store" value={formData.store} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 王品牛排" /></div>
                    <div className="col-span-2 sm:col-span-1"><label className="block text-sm font-bold text-gray-700 mb-1">🎁 優惠內容*</label><input type="text" name="offer" value={formData.offer} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 壽星五折" /></div>
                    <div className="col-span-2"><label className="block text-sm font-bold text-gray-700 mb-1">📝 使用條件</label><input type="text" name="conditions" value={formData.conditions} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 需出示身分證、加入會員" /></div>
                    <div><label className="block text-sm font-bold text-gray-700 mb-1">📅 時效 (當月/當日)</label><input type="text" name="monthDay" value={formData.monthDay} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 當月" /></div>
                    <div><label className="block text-sm font-bold text-gray-700 mb-1">🎈 分類</label><input type="text" name="category" value={formData.category} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 餐廳" /></div>
                    <div><label className="block text-sm font-bold text-gray-700 mb-1">📱 兌換通路</label><input type="text" name="channel" value={formData.channel} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 實體門市" /></div>
                    <div><label className="block text-sm font-bold text-gray-700 mb-1">⏳ 兌換期限</label><input type="text" name="deadline" value={formData.deadline} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 2026/12/31" /></div>
                    <div><label className="block text-sm font-bold text-gray-700 mb-1">🗺️ 所在縣市 1</label><input type="text" name="city1" value={formData.city1} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 台北、新北" /></div>
                    <div><label className="block text-sm font-bold text-gray-700 mb-1">🗺️ 所在縣市 2</label><input type="text" name="city2" value={formData.city2} onChange={handleInputChange} className="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 focus:border-pink-400 focus:outline-none" placeholder="例: 台中、彰化" /></div>
                  </div>
                </div>
                <div className="p-4 bg-gray-50 border-t border-gray-200 flex justify-end gap-3"><button onClick={() => setIsModalOpen(false)} className="px-6 py-2 rounded-xl font-bold text-gray-500 hover:bg-gray-200 transition-colors">取消</button><button onClick={handleSave} className="px-6 py-2 rounded-xl font-bold bg-pink-500 text-white hover:bg-pink-600 transition-colors flex items-center gap-2 shadow-md"><Save size={18} /> 儲存</button></div>
              </div>
            </div>
          )}

          {alertModal.isOpen && (
            <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full text-center border-2 border-pink-100">
                 <div className="text-4xl mb-3">💬</div>
                 <p className="text-gray-800 font-bold mb-6 whitespace-pre-wrap">{alertModal.text}</p>
                 <button onClick={() => setAlertModal({isOpen: false, text: ''})} className="bg-pink-500 text-white px-8 py-2 rounded-xl font-bold hover:bg-pink-600 w-full">知道了</button>
              </div>
            </div>
          )}

          {confirmModal.isOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full border-2 border-red-100">
                 <div className="flex items-center gap-3 text-red-500 mb-4">
                   <AlertCircle size={32} />
                   <h3 className="text-xl font-bold">確認執行</h3>
                 </div>
                 <p className="text-gray-600 font-medium mb-6">{confirmModal.text}</p>
                 <div className="flex justify-end gap-3">
                   <button onClick={() => setConfirmModal({isOpen: false, text: '', onConfirm: null})} className="px-5 py-2 rounded-xl font-bold text-gray-500 hover:bg-gray-100">取消</button>
                   <button onClick={confirmModal.onConfirm} className="px-5 py-2 rounded-xl font-bold bg-red-500 text-white hover:bg-red-600 flex items-center gap-2"><Check size={16}/> 確定</button>
                 </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // 將 App 渲染到網頁上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
